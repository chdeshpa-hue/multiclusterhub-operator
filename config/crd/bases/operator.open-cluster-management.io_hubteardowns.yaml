---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: hubteardowns.operator.open-cluster-management.io
spec:
  group: operator.open-cluster-management.io
  names:
    kind: HubTeardown
    listKind: HubTeardownList
    plural: hubteardowns
    shortNames:
    - htd
    singular: hubteardown
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Current teardown phase
      jsonPath: .status.phase
      name: Phase
      type: string
    - description: Whether dry-run mode is active
      jsonPath: .spec.dryRun
      name: Dry-Run
      type: boolean
    - description: Number of blocking resources
      jsonPath: .status.dryRunReport.totalBlockingResources
      name: Blocking
      type: integer
    - description: Number of cloud-risk resources
      jsonPath: .status.dryRunReport.totalCloudRiskResources
      name: Cloud-Risk
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          HubTeardown is the Schema for the hubteardowns API. It provides orchestrated,
          observable, and safe RHACM uninstallation with dependency graph scanning,
          ordered phase execution, and explicit cloud resource leak warnings.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: HubTeardownSpec defines the desired state of HubTeardown.
            properties:
              acknowledgeCloudResourceRisk:
                description: |-
                  AcknowledgeCloudResourceRisk records that an administrator has read the
                  cloud-risk section of the report and consents to actions that may orphan
                  cloud resources (VMs, load balancers, DNS records, volumes) outside this
                  cluster. It is the ONLY source of consent. Consent is honoured only when
                  AcknowledgedReportDigest matches status.reportDigest.
                type: boolean
              acknowledgedReportDigest:
                description: |-
                  AcknowledgedReportDigest is the digest of the inspection report the
                  administrator read before approving destructive work. Consent is bound to
                  this digest: when the report changes, the digest changes and consent
                  lapses. Required in practice for any destructive phase; an empty value
                  keeps the teardown parked at ConsentRequired.
                type: string
              dryRun:
                default: true
                description: |-
                  DryRun when true (the default) causes the controller to scan and report
                  without mutating any cluster resources. Set to false to begin teardown.
                  Can be toggled back to true at any time to pause and re-scan.
                type: boolean
              escalation:
                description: Escalation bounds the destructive phase.
                properties:
                  maxDuration:
                    default: 2h
                    description: |-
                      MaxDuration is a terminal bound. On expiry the teardown writes a terminal
                      Failed phase with the residue report. It is not advisory.
                    type: string
                  mode:
                    allOf:
                    - enum:
                      - Manual
                      - Automatic
                    - enum:
                      - Manual
                      - Automatic
                    default: Manual
                    description: |-
                      Mode selects what happens when a stall is detected.
                        Manual    - report and wait for consent (default)
                        Automatic - escalate without further consent, except for any blocker
                                    with cloudRisk.mayOrphan, which always requires consent.
                    type: string
                  stallTimeout:
                    default: 15m
                    description: |-
                      StallTimeout is how long the teardown may make no progress before
                      escalation is offered. It is measured over the Blocker model, not over
                      wall-clock phase names.
                    type: string
                type: object
              forceFinalizerTimeout:
                description: |-
                  ForceFinalizerTimeout is the duration to wait for a controller to
                  process its own finalizer before the teardown controller intervenes.
                  When unset, the effective default is 15m.
                  Deprecated: use spec.escalation.stallTimeout for new CRs.
                type: string
              hubRef:
                description: |-
                  HubRef names the MultiClusterHub this teardown targets. It is required:
                  the CR is cluster-meaningful and must not infer its target from whichever
                  MultiClusterHub happens to exist.
                properties:
                  apiVersion:
                    description: API version of the referent.
                    type: string
                  fieldPath:
                    description: |-
                      If referring to a piece of an object instead of an entire object, this string
                      should contain a valid JSON/Go field access statement, such as desiredState.manifest.containers[2].
                      For example, if the object reference is to a container within a pod, this would take on a value like:
                      "spec.containers{name}" (where "name" refers to the name of the container that triggered
                      the event) or if no container name is specified "spec.containers[2]" (container with
                      index 2 in this pod). This syntax is chosen only to have some well-defined way of
                      referencing a part of an object.
                    type: string
                  kind:
                    description: |-
                      Kind of the referent.
                      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
                    type: string
                  name:
                    description: |-
                      Name of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                  namespace:
                    description: |-
                      Namespace of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/
                    type: string
                  resourceVersion:
                    description: |-
                      Specific resourceVersion to which this reference is made, if any.
                      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#concurrency-control-and-consistency
                    type: string
                  uid:
                    description: |-
                      UID of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#uids
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              maxDuration:
                description: |-
                  MaxDuration is the maximum wall-clock time allowed for the entire
                  teardown. If exceeded, the controller writes a terminal Failed phase with
                  the residue report. Defaults to 2h.
                  Deprecated: use spec.escalation.maxDuration for new CRs.
                type: string
              mce:
                allOf:
                - enum:
                  - Default
                  - Preserve
                - enum:
                  - Default
                  - Preserve
                default: Default
                description: |-
                  MCE selects what happens to MultiClusterEngine.
                    Default  - MCE is removed only when this MCH created it (installer
                               labels match hubRef); a pre-existing MCE is preserved.
                    Preserve - MCE is never touched, even when this MCH created it.
                  Removing a pre-existing, user-installed MCE is deliberately not offered.
                type: string
            required:
            - dryRun
            - hubRef
            type: object
          status:
            description: HubTeardownStatus defines the observed state of HubTeardown.
            properties:
              activeSince:
                description: |-
                  ActiveSince is the timestamp when the teardown transitioned from
                  dry-run to active execution. Used to calculate overall stall timeout.
                format: date-time
                type: string
              blockers:
                description: |-
                  Blockers is a capped view of the complete blocker list. The cap keeps
                  status small enough that admission and etcd never reject the update: 32
                  leaves room for roughly 8KB of Blocker JSON, well inside the 1.5MB
                  object limit when combined with the existing status arrays.
                  The complete list always lives in the report ConfigMap.
                items:
                  description: |-
                    Blocker is the single record consumed by the report, status, MCH mirror and
                    verification. UID is the identity and the join key; name is report-only.
                  properties:
                    apiVersion:
                      type: string
                    blockedSince:
                      format: date-time
                      type: string
                    classification:
                      description: Classification names the failure mode a Blocker
                        represents.
                      type: string
                    cloudRisk:
                      description: CloudRisk records the consequence of acting outside
                        the cluster.
                      properties:
                        mayOrphan:
                          type: boolean
                        platform:
                          type: string
                        platformKnown:
                          description: |-
                            PlatformKnown distinguishes a recognised platform (cloud or KubeVirt)
                            from an absent or unfamiliar string. It is evidence quality, not a gate:
                            only MayOrphan authorises a consent requirement.
                          type: boolean
                        resourceType:
                          type: string
                      required:
                      - mayOrphan
                      - platform
                      - platformKnown
                      - resourceType
                      type: object
                    consentReason:
                      type: string
                    controllerAlive:
                      type: boolean
                    controllerEvidence:
                      items:
                        description: Evidence is one observation, with where it was
                          read from.
                        properties:
                          detail:
                            type: string
                          kind:
                            description: EvidenceKind identifies one observation that
                              bears on ownership.
                            type: string
                          observed:
                            format: date-time
                            type: string
                          source:
                            type: string
                        required:
                        - detail
                        - kind
                        - observed
                        - source
                        type: object
                      type: array
                    deletionTimestamp:
                      format: date-time
                      type: string
                    finalizers:
                      items:
                        type: string
                      type: array
                    kind:
                      type: string
                    name:
                      type: string
                    namespace:
                      type: string
                    observedInPhase:
                      description: |-
                        TeardownPhase represents the current high-level phase of the teardown process.

                        Both the legacy and the prototype values are accepted while the controller
                        cutover is pending. Removing the legacy values is part of that cutover, not
                        of the additive API change.
                      enum:
                      - DryRun
                      - RemoveBlockingCRs
                      - DisableAddons
                      - DeleteInfrastructureCRs
                      - DetachManagedClusters
                      - DeleteMCH
                      - MonitorMCEChain
                      - DeleteACMCRDs
                      - Complete
                      - Failed
                      - NotStarted
                      - Inspecting
                      - ReportReady
                      - ConsentRequired
                      - Preparing
                      - HandedOff
                      - Stalled
                      - Escalating
                      - Verifying
                      - CompleteWithResidue
                      type: string
                    ownership:
                      description: OwnershipVerdict is the answer plus the evidence
                        that produced it.
                      properties:
                        confidence:
                          description: |-
                            Confidence is the maximum confidence over the evidence list. It is never a
                            sum: two Weak observations do not make a Strong one.
                          type: string
                        evidence:
                          items:
                            description: Evidence is one observation, with where it
                              was read from.
                            properties:
                              detail:
                                type: string
                              kind:
                                description: EvidenceKind identifies one observation
                                  that bears on ownership.
                                type: string
                              observed:
                                format: date-time
                                type: string
                              source:
                                type: string
                            required:
                            - detail
                            - kind
                            - observed
                            - source
                            type: object
                          type: array
                        owned:
                          type: boolean
                      required:
                      - confidence
                      - evidence
                      - owned
                      type: object
                    owningController:
                      description: ControllerRef identifies the workload that should
                        process a finalizer.
                      properties:
                        finalizerDomain:
                          type: string
                        kind:
                          type: string
                        name:
                          type: string
                        namespace:
                          type: string
                        resolution:
                          description: |-
                            ControllerResolution records how the controller responsible for a finalizer
                            was identified.
                          type: string
                      required:
                      - finalizerDomain
                      - kind
                      - name
                      - resolution
                      type: object
                    relatedFix:
                      type: string
                    requiresConsent:
                      type: boolean
                    suggestedAction:
                      description: |-
                        SuggestedAction is the policy's suggestion. A human or a later automation
                        performs it.
                      type: string
                    uid:
                      description: |-
                        UID is a type that holds unique ID values, including UUIDs.  Because we
                        don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                        intent and helps make sure that UIDs and names do not get conflated.
                      type: string
                  required:
                  - apiVersion
                  - blockedSince
                  - classification
                  - kind
                  - name
                  - observedInPhase
                  - ownership
                  - requiresConsent
                  - suggestedAction
                  - uid
                  type: object
                maxItems: 32
                type: array
              blockersTruncated:
                description: BlockersTruncated is the number of blockers omitted from
                  Blockers.
                format: int32
                type: integer
              blockingResources:
                description: |-
                  BlockingResources lists resources that prevent MCH deletion via
                  the validating webhook.
                items:
                  description: BlockingResource identifies a resource that prevents
                    MCH deletion.
                  properties:
                    group:
                      description: Group is the API group of the resource.
                      type: string
                    kind:
                      description: Kind is the resource kind.
                      type: string
                    name:
                      description: Name is the resource name.
                      type: string
                    namespace:
                      description: Namespace is the resource namespace (empty for
                        cluster-scoped).
                      type: string
                    reason:
                      description: Reason explains why this resource blocks uninstall.
                      type: string
                  required:
                  - group
                  - kind
                  - name
                  - reason
                  type: object
                type: array
              cloudResourceWarnings:
                description: |-
                  CloudResourceWarnings lists resources with cloud-protecting finalizers
                  and their platform-specific risk descriptions.
                items:
                  description: CloudResourceWarning describes a resource whose finalizer
                    protects cloud infrastructure.
                  properties:
                    acknowledged:
                      description: Acknowledged indicates whether the admin has reviewed
                        this warning.
                      type: boolean
                    finalizer:
                      description: Finalizer is the specific finalizer string that
                        protects cloud resources.
                      type: string
                    platform:
                      description: Platform is the cloud platform (AWS, Azure, GCP,
                        etc.) if detectable.
                      type: string
                    resource:
                      description: Resource identifies the Kubernetes resource.
                      properties:
                        group:
                          description: Group is the API group of the resource.
                          type: string
                        kind:
                          description: Kind is the resource kind.
                          type: string
                        name:
                          description: Name is the resource name.
                          type: string
                        namespace:
                          description: Namespace is the resource namespace (empty
                            for cluster-scoped).
                          type: string
                      required:
                      - group
                      - kind
                      - name
                      type: object
                    riskSummary:
                      description: |-
                        RiskSummary is a human-readable description of what cloud resources
                        will be orphaned if this finalizer is removed.
                      type: string
                  required:
                  - acknowledged
                  - finalizer
                  - resource
                  - riskSummary
                  type: object
                type: array
              cloudRisk:
                description: |-
                  CloudRisk is aggregated per platform and resource type and is never
                  truncated. An administrator must be able to give informed consent from
                  status alone.
                items:
                  description: |-
                    CloudRiskSummary is the aggregated, never-truncated view of cloud risk that
                    status carries. One entry exists per (platform, resourceType) pair; the
                    per-object detail stays in the report ConfigMap.
                  properties:
                    consoleHint:
                      type: string
                    count:
                      format: int32
                      type: integer
                    namespaces:
                      items:
                        type: string
                      type: array
                    platform:
                      type: string
                    resourceType:
                      type: string
                  required:
                  - count
                  - platform
                  - resourceType
                  type: object
                type: array
              conditions:
                description: Conditions reflect the current state of the teardown
                  process.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              dryRunReport:
                description: |-
                  DryRunReport contains the full teardown preview generated during
                  dry-run mode. Updated on each reconcile while dryRun is true.
                properties:
                  plannedPhases:
                    description: PlannedPhases is an ordered list of phases with per-phase
                      detail.
                    items:
                      description: PlannedPhase describes what a single teardown phase
                        will do.
                      properties:
                        action:
                          description: Action is a short description of what this
                            phase will do.
                          type: string
                        cloudRiskResources:
                          description: CloudRiskResources is the count of Tier 1 resources
                            in this phase.
                          type: integer
                        details:
                          description: Details is a per-resource breakdown of what
                            will happen.
                          items:
                            type: string
                          type: array
                        phase:
                          description: Phase name (matches TeardownPhase enum).
                          enum:
                          - DryRun
                          - RemoveBlockingCRs
                          - DisableAddons
                          - DeleteInfrastructureCRs
                          - DetachManagedClusters
                          - DeleteMCH
                          - MonitorMCEChain
                          - DeleteACMCRDs
                          - Complete
                          - Failed
                          - NotStarted
                          - Inspecting
                          - ReportReady
                          - ConsentRequired
                          - Preparing
                          - HandedOff
                          - Stalled
                          - Escalating
                          - Verifying
                          - CompleteWithResidue
                          type: string
                        resourcesAffected:
                          description: ResourcesAffected is the count of resources
                            this phase touches.
                          type: integer
                      required:
                      - action
                      - phase
                      - resourcesAffected
                      type: object
                    type: array
                  scanTime:
                    description: ScanTime is when the last scan was performed.
                    format: date-time
                    type: string
                  summary:
                    description: Summary is a human-readable overview of the teardown
                      plan.
                    type: string
                  totalBlockingResources:
                    description: TotalBlockingResources is the count of resources
                      blocking uninstall.
                    type: integer
                  totalCloudRiskResources:
                    description: TotalCloudRiskResources is the count of resources
                      with Tier 1 finalizers.
                    type: integer
                required:
                - plannedPhases
                - scanTime
                - summary
                - totalBlockingResources
                - totalCloudRiskResources
                type: object
              lastInspection:
                description: |-
                  LastInspection is when the inspector last completed a full scan. It is
                  set even when the scan found nothing, so an empty blocker list can be
                  read as an observation rather than as a missing scan.
                format: date-time
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the metadata.generation the controller last
                  reconciled. It lets a reader see whether the status reflects the current
                  spec without diffing every field.
                format: int64
                type: integer
              pausedAt:
                description: |-
                  PausedAt records when the admin paused an active teardown by setting
                  dryRun back to true. The deadline does not accrue while paused: on
                  resume ActiveSince is shifted forward by the paused interval.
                format: date-time
                type: string
              phase:
                description: Phase is the current high-level phase of the teardown
                  process.
                enum:
                - DryRun
                - RemoveBlockingCRs
                - DisableAddons
                - DeleteInfrastructureCRs
                - DetachManagedClusters
                - DeleteMCH
                - MonitorMCEChain
                - DeleteACMCRDs
                - Complete
                - Failed
                - NotStarted
                - Inspecting
                - ReportReady
                - ConsentRequired
                - Preparing
                - HandedOff
                - Stalled
                - Escalating
                - Verifying
                - CompleteWithResidue
                type: string
              phases:
                description: Phases tracks the status of each teardown phase.
                items:
                  description: TeardownPhaseStatus tracks the execution state of one
                    teardown phase.
                  properties:
                    completionTime:
                      description: CompletionTime is when this phase finished.
                      format: date-time
                      type: string
                    message:
                      description: Message provides human-readable detail about the
                        phase state.
                      type: string
                    phase:
                      description: Phase name.
                      enum:
                      - DryRun
                      - RemoveBlockingCRs
                      - DisableAddons
                      - DeleteInfrastructureCRs
                      - DetachManagedClusters
                      - DeleteMCH
                      - MonitorMCEChain
                      - DeleteACMCRDs
                      - Complete
                      - Failed
                      - NotStarted
                      - Inspecting
                      - ReportReady
                      - ConsentRequired
                      - Preparing
                      - HandedOff
                      - Stalled
                      - Escalating
                      - Verifying
                      - CompleteWithResidue
                      type: string
                    startTime:
                      description: StartTime is when this phase began executing.
                      format: date-time
                      type: string
                    state:
                      description: State is the current execution state of this phase.
                      type: string
                  required:
                  - phase
                  - state
                  type: object
                type: array
              reportDigest:
                description: |-
                  ReportDigest is the digest of the report named by ReportRef, as recorded
                  in the report's meta.json. It is what spec.acknowledgedReportDigest is
                  compared against, so consent never depends on a name that could be reused.
                type: string
              reportRef:
                description: |-
                  ReportRef names the ConfigMap holding the complete inspection report.
                  The report carries no ownerReferences, so it outlives the HubTeardown CR
                  and remains available after the teardown finishes.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              residue:
                description: |-
                  Residue is the Verify phase's postcondition record. It is written only
                  in a terminal phase, because it is the one field that must be written
                  after the MultiClusterHub no longer exists.
                properties:
                  complete:
                    description: |-
                      Complete is true only when nothing outside ExpectedSurvivors remains AND
                      the inventory was complete. An incomplete inventory cannot prove
                      absence, so it can never produce Complete.
                    type: boolean
                  completeWithResidueReason:
                    description: |-
                      CompleteWithResidueReason names why Complete was refused when the
                      inventory was incomplete. Empty when Complete is true or when ordinary
                      residue is the reason.
                    type: string
                  expectedSurvivors:
                    description: ExpectedSurvivors are objects the teardown deliberately
                      leaves behind.
                    items:
                      description: ResidueItem identifies one object seen at Verify
                        time.
                      properties:
                        apiVersion:
                          description: APIVersion is group/version when known.
                          type: string
                        kind:
                          type: string
                        name:
                          type: string
                        namespace:
                          type: string
                        reason:
                          description: Reason explains why the item is expected, or
                            why it is residue.
                          type: string
                      required:
                      - kind
                      - name
                      - reason
                      type: object
                    type: array
                  observedAt:
                    description: ObservedAt is when Verify ran.
                    format: date-time
                    type: string
                  residue:
                    description: Residue is everything else that Verify observed.
                    items:
                      description: ResidueItem identifies one object seen at Verify
                        time.
                      properties:
                        apiVersion:
                          description: APIVersion is group/version when known.
                          type: string
                        kind:
                          type: string
                        name:
                          type: string
                        namespace:
                          type: string
                        reason:
                          description: Reason explains why the item is expected, or
                            why it is residue.
                          type: string
                      required:
                      - kind
                      - name
                      - reason
                      type: object
                    type: array
                required:
                - complete
                - observedAt
                type: object
              summary:
                description: Summary is the never-truncated aggregate over the complete
                  blocker list.
                properties:
                  byClassification:
                    additionalProperties:
                      format: int32
                      type: integer
                    description: ByClassification counts blockers per classification.
                    type: object
                  requiringConsent:
                    description: |-
                      RequiringConsent is the number of blockers whose SuggestedAction needs
                      explicit administrator approval.
                    format: int32
                    type: integer
                  total:
                    description: Total is the number of blockers in the complete report.
                    format: int32
                    type: integer
                required:
                - requiringConsent
                - total
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
